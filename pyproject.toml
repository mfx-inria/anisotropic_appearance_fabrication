[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "cglib"
version = "0.1.0"
authors = [
    {name = "Xavier Chermain", email = "xavier.chermain@inria.fr"},
]
description = "Computer Graphics Library"
readme = "README.md"
requires-python = ">=3.10,<3.11"
keywords = ["graphics", "fabrication"]
license = {file = "LICENSE"}
dependencies = [
    "jax==0.6.2",
    "jaxlib==0.6.2",
    "svgpathtools~=1.6",
    "pyvista~=0.40",
    "Pillow~=9.5",
]
